<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Sign Up Form</h1>
        <p>Create your account below.</p>
    </header>

    <main>
        <form id="signupForm">
            <fieldset>
                <legend>Sign Up</legend>

                <label for="firstName">First Name:</label>
                <input id="firstName" type="text"><br>

                <label for="lastName">Last Name:</label>
                <input id="lastName" type="text"><br>

                <label for="email">Email:</label>
                <input id="email" type="email"><br>

                <label for="phone">Phone Number:</label>
                <input id="phone" type="text"><br><br>

                <label for="zipCode">Zip Code:</label>
                <input id="zipCode" type="text" maxlength="5"><br>

                <p id="zipMessage" class="message"></p>
                <p id="cityInfo" class="location">City:</p>
                <p id="latitudeInfo" class="location">Latitude:</p>
                <p id="longitudeInfo" class="location">Longitude:</p>

                <label for="state">State:</label>
                <select id="state">
                    <option value="">Select State</option>
                </select><br>

                <label for="county">Select a County:</label>
                <select id="county">
                    <option value="">Select County</option>
                </select><br><br>

                <label for="username">Desired Username:</label>
                <input id="username" type="text"><br>
                <p id="usernameMessage" class="message"></p>

                <label for="password">Password:</label>
                <input id="password" type="password"><br>
                <p id="suggestedPassword" class="message"></p>

                <label for="passwordAgain">Type Password Again:</label>
                <input id="passwordAgain" type="password"><br><br>

                <input id="signupButton" type="submit" value="Sign up!">
                <p id="passwordError" class="message"></p>
            </fieldset>
        </form>
    </main>

    <script src="scripts/script.js"></script>
</body>
</html>

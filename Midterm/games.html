<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Free Game Search</h1>

        <nav>
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" href="games.html">Games</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="anime.html">Anime</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="filters">
            <h2>Filters</h2>

            <p>Platform:</p>

            <input type="radio" id="windows" name="platform" value="windows">
            <label for="windows">Windows</label>

            <input type="radio" id="browser" name="platform" value="browser">
            <label for="browser">Browser</label>

            <br><br>

            <label for="categoryFilter">Category:</label>
            <select id="categoryFilter">
                <option value="">Select Category</option>
                <option value="mmorpg">MMORPG</option>
                <option value="shooter">Shooter</option>
                <option value="strategy">Strategy</option>
                <option value="racing">Racing</option>
                <option value="anime">Anime</option>
            </select>

            <br><br>

            <button id="resetGameButton" type="button">Reset Filters</button>

            <br><br>

            <label for="pageFilter">Page:</label>
            <select id="pageFilter">
                <option value="1">Page 1</option>
            </select>
        </section>

        <h2>Results</h2>
        <section id="gameResults" class="resultsGrid"></section>
    </main>

    <footer>
        <p>CST 336 Midterm Project</p>
        <p>Game data provided by <a href="https://www.freetogame.com">FreeToGame.com</a></p>
    </footer>

    <script src="js/games.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="centerMyText">
    <h1 class="myFontStyle">Guess the Number</h1>
    <br>
    <hr>
    <br>
    <p>Guess a number between 1 and 99.</p>

    <input id="guessInput" type="number">
    <button id="guessButton" class="stylizedButton">Guess!</button>
    <button id="resetButton" class="stylizedButton" hidden>Reset</button>
    <br>
    <br>
    <hr>
    <br>
    <p id="guessMessage">Message goes here</p>
    <p>Previous guesses:<span id="previousGuesses"></span></p>
    <p>Games won: <span id="gamesWon">0</span> | Games lost: <span id="gamesLost">0</span></p>

    <script src="scripts/script.js" defer></script>
</body>

</html>
